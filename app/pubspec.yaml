name: rm_pulse_installer
description: RM Pulse Installer — offline-first field installation capture app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3+1

  # Offline storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2

  # Device / security
  device_info_plus: ^10.1.0
  # NOTE: raw IMEI is restricted on Android 10+. We use a stable device
  # identifier (ANDROID_ID / hardware fingerprint) as the binding key and
  # keep the field name `imei` for backend compatibility. See DeviceService.
  package_info_plus: ^8.0.0
  safe_device: ^1.1.4 # root / emulator / mock-location detection

  # Location
  geolocator: ^12.0.0

  # Camera
  camera: ^0.11.0+2
  image: ^4.2.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Utils
  intl: ^0.20.3
  uuid: ^4.4.0
  crypto: ^3.0.3 # SHA-256 for duplicate image detection
  # NOTE: localization strings are delivered inside the JSON config, so no
  # localization asset package is needed — languages are switched at runtime.

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/images/
